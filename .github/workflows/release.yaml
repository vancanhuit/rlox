# Release pipeline.
#
# Triggered by pushing a semver tag of the form `v1.2.3` or `v1.2.3-beta1`.
# Builds the VM-backed rlox binary for Linux, macOS, and Windows on native
# runners (no cross-compilation), packages Unix-like builds as tarballs and
# Windows builds as zip files with per-archive sha256 files, then aggregates
# everything into a single GitHub Release whose body is rendered by git-cliff
# from the (prev_tag, this_tag] range.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*" # v1.2.3-beta1, v1.2.3-rc.1, ...

permissions:
  contents: read

# Two concurrent runs for the same tag would race on the GH Release create +
# asset upload. Different tags are independent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt every JS-based action into the Node 24 runtime ahead of the
  # June 2 2026 GitHub Actions deadline. Actions explicitly bumped to
  # their Node 24 major below; this env var covers any transitive
  # JS-based dependency that hasn't shipped a Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            binary: rlox
          - target: aarch64-unknown-linux-gnu
            # Native ARM64 runner — free for public repos. Avoids the
            # cross-toolchain dance that `cargo build --target` on x86_64
            # would otherwise require for a glibc-linked binary.
            runner: ubuntu-24.04-arm
            archive: tar.gz
            binary: rlox
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
            binary: rlox
          - target: aarch64-apple-darwin
            runner: macos-15
            archive: tar.gz
            binary: rlox
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            binary: rlox.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive: zip
            binary: rlox.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        # `rust-toolchain.toml` pins the channel + components; the host
        # target is added automatically by rustup on the matching runner.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Per-target cache so the matrix legs don't thrash.
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin rlox --target ${{ matrix.target }} --no-default-features --features vm

      - name: Package binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="rlox_${GITHUB_REF_NAME}_${TARGET}.tar.gz"
          stage="dist/rlox_${GITHUB_REF_NAME}_${TARGET}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/${BINARY}" "$stage/rlox"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          tar -czf "dist/$archive" -C dist "$(basename "$stage")"
          rm -rf "$stage"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "$archive" > "$archive.sha256" )
          else
            ( cd dist && shasum -a 256 "$archive" > "$archive.sha256" )
          fi
          ls -la dist

      - name: Package binary (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "rlox_${env:GITHUB_REF_NAME}_${env:TARGET}.zip"
          $stage = "dist/rlox_${env:GITHUB_REF_NAME}_${env:TARGET}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BINARY}" (Join-Path $stage $env:BINARY)
          Copy-Item README.md, LICENSE $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "dist/$archive" -Force
          Remove-Item -Recurse -Force $stage
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -FilePath "dist/$archive.sha256" -Encoding ascii
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rlox-${{ matrix.target }}
          path: |
            dist/rlox_*.tar.gz
            dist/rlox_*.tar.gz.sha256
            dist/rlox_*.zip
            dist/rlox_*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          # git-cliff walks the tag graph for the (prev_tag, this_tag]
          # range; it needs the entire history.
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          # Produce a single SHA256SUMS that lists every release archive.
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          ls -la

      - name: Generate release notes
        # `--current` resolves the previous semver tag from git's tag
        # graph automatically. Output is written to dist/CHANGELOG.md
        # via the action's $OUTPUT env contract.
        # Stable releases ignore prerelease tags so a temporary tag such
        # as `v0.3.0-dev` does not split or duplicate the final notes.
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current ${{ contains(github.ref_name, '-') && '' || '--ignore-tags ".*-.*"' }}
        env:
          OUTPUT: dist/CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: dist/CHANGELOG.md
          # The leading `-` in the tag (e.g. v1.2.3-beta1) marks it as
          # a prerelease per semver; Releases-page UX hides these from
          # "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/rlox_*.tar.gz
            dist/rlox_*.tar.gz.sha256
            dist/rlox_*.zip
            dist/rlox_*.zip.sha256
            dist/SHA256SUMS
